name: shader_debugger_devtools
description: >-
  The Shader Debugger DevTools extension (a Flutter web app). Its web build
  ships inside package:shader_debugger under extension/devtools/build.
publish_to: none
version: 0.0.1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  devtools_app_shared: ^0.5.1
  devtools_extensions: ^0.5.1
  flutter:
    sdk: flutter
  shader_debugger_core:
    path: ../shader_debugger_core

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
