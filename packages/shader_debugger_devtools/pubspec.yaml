name: shader_debugger_devtools
description: >-
  The Shader Debugger DevTools extension (a Flutter web app). Its web build
  ships inside package:shader_debugger under extension/devtools/build.
# Not published on its own: its build ships in package:shader_debugger.
publish_to: none
version: 1.0.1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  devtools_app_shared: ^0.5.1
  devtools_extensions: ^0.5.1
  # File access through the Dart Tooling Daemon; its errors are json_rpc_2's.
  dtd: ^4.0.0
  flutter:
    sdk: flutter
  json_rpc_2: ^4.1.0
  # Resolves to the workspace package.
  shader_debugger_core: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # For test/live_test.dart, which talks to a real app's VM service.
  vm_service: ^15.0.0

flutter:
  uses-material-design: true
