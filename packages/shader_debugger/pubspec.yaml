name: shader_debugger
description: >-
  Debug-only runtime for the Flutter shader debugger. It records fragment
  shader uniforms and draws probe shaders for the Shader Debugger DevTools
  extension.
version: 1.0.0
repository: https://github.com/mohamedalsamrai/shader_debugger/tree/main/packages/shader_debugger
issue_tracker: https://github.com/mohamedalsamrai/shader_debugger/issues
topics:
  - shaders
  - devtools
  - debugging
  - graphics
resolution: workspace

environment:
  sdk: ^3.13.0
  # Needs the name-based uniform API (FragmentShader.getUniformFloat) and
  # FragmentProgram hot-reload rebinding. Only tested on 3.47 so far.
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Only `package:shader_debugger_core/protocol.dart`, which has no
  # dependencies. Resolves to the workspace package.
  shader_debugger_core: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
